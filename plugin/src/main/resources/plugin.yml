name: HardcoreShared
version: 1.0.0
main: fr.hardcore.HardcorePlugin
api-version: '1.21'
load: STARTUP
author: Erwan
description: Hardcore coop a vie et faim partagees, regeneration totale du monde a chaque mort, lobby avec statistiques.
commands:
  hc:
    description: Commandes du mode Hardcore partage
    usage: /hc <stats|start|stop|reload|resetstats>
permissions:
  hardcoreshared.admin:
    description: Acces aux commandes admin
    default: op
